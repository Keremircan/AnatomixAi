<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060b12" />
    <title>Bağlantı yok · ANATOMIX.AI</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(60% 50% at 50% 0%, rgb(34 211 238 / 0.12), transparent 70%), #060b12;
        color: #e2ebf3;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .tile {
        display: grid;
        place-items: center;
        width: 88px;
        height: 88px;
        margin: 0 auto;
        border-radius: 24px;
        background: #fff;
      }
      .tile img {
        height: 72px;
        width: auto;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 auto;
        max-width: 340px;
        color: #8b9caf;
      }
      .emergency {
        margin: 20px auto 0;
        max-width: 340px;
        padding: 12px 14px;
        border: 1px solid rgb(244 63 63 / 0.4);
        border-radius: 14px;
        background: rgb(244 63 63 / 0.1);
        color: #fca5a5;
      }
      .emergency a {
        color: #fff;
        font-weight: 600;
      }
      button {
        margin-top: 24px;
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 14px;
        background: #22d3ee;
        color: #03141c;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tile"><img src="/brand/anatomix-mark.png" alt="ANATOMIX.AI" /></div>
      <h1>İnternet bağlantısı yok</h1>
      <p>ANATOMIX.AI şikayet analizini sunucuda yapar. Bağlantınız geldiğinde kaldığınız yerden devam edebilirsiniz.</p>
      <p class="emergency">Acil bir durumdaysanız beklemeyin: <a href="tel:112">112’yi arayın</a>.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
